<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vera">
  <!--
    La marca de Vera: tres nodos en V y los vínculos entre ellos. Dice lo que
    Vera es — cosas, y lo que las une.

    El dibujo es el de `assets/vera_vera-logo.svg`, en su lienzo original de 64
    para que no pase por ninguna conversión. El trazo va escrito aquí y no
    importado de icons.ts porque este archivo lo leen el sistema operativo al
    instalar la aplicación y el navegador al dibujar la pestaña: no puede
    depender de que ningún guion llegue a ejecutarse.

    Fondo negro y trazo blanco, y no los colores del tema. Un icono se ve sobre
    el escritorio, el dock y la pestaña —fondos que Vera no controla y que
    cambian con el tema del sistema— y el máximo contraste es lo único que se
    sostiene en todos. El radio deja que el sistema redondee las esquinas sin
    comerse un nodo.
  -->
  <rect width="64" height="64" rx="12" fill="#000"/>
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="20" r="6"/>
    <circle cx="32" cy="44" r="6"/>
    <circle cx="46" cy="20" r="6"/>
    <line x1="35" y1="38.8" x2="43" y2="25.2"/>
    <line x1="21" y1="25.2" x2="29" y2="38.8"/>
  </g>
</svg>
