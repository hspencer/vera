name: Desktop

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run spec
      - run: npm run build
      # Algunas suites levantan servidores y sesiones con identidades fijas;
      # en CI deben ejecutarse por archivo para no compartir estado efímero.
      - run: npm test -- --test-concurrency=1
      - run: npm run typecheck

      - name: Verificar que el tag coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:verify-tag

  windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Exigir identidad Authenticode
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WIN_CSC_LINK -or -not $env:WIN_CSC_KEY_PASSWORD) {
            throw 'Faltan WINDOWS_CERTIFICATE o WINDOWS_CERTIFICATE_PASSWORD; no se publica Vera sin firma.'
          }

      - name: Construir instalador, portable y manifiesto
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run pack:windows -- --publish never

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' } |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content release/SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Vera-Windows-x64
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/SHA256SUMS-windows.txt

  macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Exigir firma y notarización de Apple
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Construir DMG universal, ZIP de actualización y manifiesto
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run pack:mac -- --publish never

      - name: Checksums
        run: |
          cd release
          shasum -a 256 *.dmg *.zip *.yml *.blockmap > SHA256SUMS-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Vera-macOS-universal
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
            release/SHA256SUMS-macos.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Vera-*
          path: release
          merge-multiple: true

      - name: Publicar una sola release multiplataforma
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
