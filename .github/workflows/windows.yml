name: Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      # Algunas suites levantan servidores y sesiones con identidades fijas;
      # en CI deben ejecutarse por archivo para no compartir estado efímero.
      - run: npm test -- --test-concurrency=1
      - run: npm run typecheck

  build:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:desktop

      - name: Construir instalador y portable
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Vera-Windows-x64
          path: |
            release/*.exe
            release/*.yml
            release/SHA256SUMS.txt

      - name: Publicar tag en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release/*.exe release/*.yml release/SHA256SUMS.txt --verify-tag --generate-notes
