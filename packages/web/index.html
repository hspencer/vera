<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vera</title>
    <meta name="description" content="Memoria personal soberana: versionable, editable, replicable y auditable." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#16181c" />

    <!-- La pestaña y la aplicación instalada llevan la misma marca. Sin estas
         dos líneas el navegador buscaba `/favicon.ico`, no lo encontraba y
         dejaba la pestaña con el icono genérico: Vera tenía icono para el
         sistema operativo y ninguno para el navegador. El SVG es el que manda;
         el PNG está para quien no lo acepte. -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />

    <!-- iOS no lee los iconos del manifiesto ni acepta SVG para la pantalla de
         inicio: sin este PNG usaría una miniatura de la captura de pantalla.
         Las esquinas las redondea el sistema, así que la imagen va a sangre. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Vera" />
    <!-- Junto con viewport-fit=cover, deja que el fondo llegue hasta el notch. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <!--
      Red de seguridad. Si el guion de la aplicación no llega a ejecutarse —sin
      red, con el service worker sirviendo un armazón cuyo asset no tiene
      cacheado, o con un error de carga— la página quedaba en blanco y muda.
      Este aviso vive en el HTML, así que no depende de nada que pueda fallar, y
      el propio arranque lo retira en cuanto toma el control.
    -->
    <div id="sin-arranque" role="status">
      <p>Vera no pudo arrancar.</p>
      <p>Puede que el servidor no esté respondiendo. Se reintenta solo.</p>
      <button type="button" onclick="location.reload()">recargar</button>
    </div>

    <div id="vera-root" data-layout="split">
      <header id="bar">
        <!-- La marca la dibuja icons.ts, para que el icono tenga una sola
             definición y no se separe del que usa el resto de la interfaz. El
             nombre sigue estando, en la etiqueta accesible y en el título. -->
        <span id="brand" title="Vera" role="img" aria-label="Vera"></span>

        <!--
          El switch de la vista, de tres posiciones y en el orden del espacio que
          gobierna: mapa a la izquierda, texto a la derecha, y en medio los dos.
          Mover el switch a la derecha es acercarse; a la izquierda, alejarse.
          Los dibujos los pone icons.ts.
        -->
        <div id="view-switch" role="group" aria-label="Vista">
          <button data-layout="graph_only" aria-label="Sólo el mapa" title="Sólo el mapa"></button>
          <button data-layout="split" aria-label="Mapa y texto" title="Mapa y texto"></button>
          <button data-layout="text_only" aria-label="Sólo el texto" title="Sólo el texto"></button>
        </div>

        <!--
          Atrás, adelante y hoy. La fecha es el botón: dice a dónde lleva sin que
          haga falta un icono al lado que repita lo mismo peor.
        -->
        <nav id="nav" aria-label="Navegación">
          <button id="back" aria-label="Atrás" title="Atrás"></button>
          <button id="forward" aria-label="Adelante" title="Adelante"></button>
          <button id="home" aria-label="Hoy" title="El día de hoy">
            <time id="hoy"></time>
          </button>
        </nav>

        <!-- El buscador toma el espacio que sobra: es lo único de la barra que
             mejora al ser más ancho. -->
        <div id="search-wrap">
          <input id="search" type="search" placeholder="buscar en el grafo" autocomplete="off" />
          <div id="results" hidden></div>
        </div>

        <div id="controls">
          <!-- El contenido de estos tres lo pone icons.ts. El texto accesible
               va en aria-label, que es lo que se lee: un icono a solas no se
               anuncia, y el dibujo no reemplaza al nombre de la acción. -->
          <button
            id="insert-voice"
            aria-label="Insertar voz"
            title="Hablar: lo grabado queda en el día de hoy"
          ></button>
          <button id="scheme" aria-label="Claro u oscuro"></button>
          <button id="settings" aria-label="Ajustes" title="Ajustes de Vera"></button>
        </div>
      </header>

      <!--
        De izquierda a derecha, de lo general a lo particular.

        El mapa es el «ante»: el total, desde donde uno se ubica y filtra. El
        texto es el «dentro». La lectura occidental va en ese sentido, así que
        entrar en un documento es un movimiento hacia la derecha y salir a mirar
        el conjunto es uno hacia la izquierda. Invertirlo obligaría a leer al
        revés lo que se está haciendo.
      -->
      <section id="graph">
        <!--
          Lo que gobierna el mapa vive en el mapa. Un control puesto lejos de lo
          que gobierna obliga a aprender una correspondencia que la disposición
          podría haber contado sola.
        -->
        <!--
          Lo que gobierna el mapa vive en el mapa, y dentro de un panel que se
          puede cerrar. Un mapa es para mirarlo: sus controles no pueden ocupar
          sitio permanente sobre lo que se está mirando.
        -->
        <div id="map-controls">
          <button
            id="map-panel-toggle"
            aria-label="Controles del mapa"
            aria-expanded="true"
            aria-controls="map-panel"
            title="Mostrar u ocultar los controles del mapa"
          ></button>

          <div id="map-panel">
            <div class="map-panel-row">
              <button data-view="graph_2d" title="Mapa en dos dimensiones">2D</button>
              <button data-view="graph_3d" title="Mapa en tres dimensiones">3D</button>
              <!--
                Hasta dónde llega el mapa, contado en saltos desde la página en
                foco. Es distancia del grafo y no cantidad de nodos: la pregunta
                que uno se hace es «qué tan lejos de aquí».
              -->
              <label id="map-reach" title="Cuántos saltos desde la página en foco">
                <input type="range" min="1" max="4" step="1" />
                <span id="map-reach-value">2</span>
              </label>
            </div>

            <!-- Por dónde se ha pasado, acumulándose. Va aquí porque el mapa es
                 la superficie de saber dónde está uno. -->
            <nav id="map-trail" aria-label="Por dónde se ha pasado"></nav>
          </div>
        </div>
      </section>
      <div id="divider" role="separator" aria-orientation="vertical" tabindex="0"></div>
      <main id="text"></main>
      <div id="tokens" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
